<svg xmlns="http://www.w3.org/2000/svg" width="640" height="348" viewBox="0 0 640 348" role="img">
<title>Evidence that can be followed</title>
<desc>The query produces an observation and a query receipt. Inspection reads that same receipt and creates a separate inspection receipt.</desc>
<rect width="100%" height="100%" fill="white"/>
<text x="320" y="30" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#173a53">Evidence that can be followed</text>
<rect x="24" y="54" width="592" height="67" rx="7" fill="#f2f6f8" stroke="#426477" stroke-width="2"/>
<text x="320" y="79" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#173a53">Query result + query receipt</text>
<text x="320" y="103" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#253a45">Names source, policy, warning and content identity</text>
<path d="M320 124 V138 M314 133 L320 139 L326 133" fill="none" stroke="#426477" stroke-width="2"/>
<rect x="24" y="144" width="592" height="67" rx="7" fill="#f2f6f8" stroke="#426477" stroke-width="2"/>
<text x="320" y="169" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#173a53">Inspect that exact receipt identifier</text>
<text x="320" y="193" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#253a45">Verify the returned record and content identity</text>
<path d="M320 214 V228 M314 223 L320 229 L326 223" fill="none" stroke="#426477" stroke-width="2"/>
<rect x="24" y="234" width="592" height="67" rx="7" fill="#f2f6f8" stroke="#426477" stroke-width="2"/>
<text x="320" y="259" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#173a53">Inspection result + its own receipt</text>
<text x="320" y="283" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#253a45">Separate record of the inspection operation</text>
</svg>
