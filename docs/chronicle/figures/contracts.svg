<svg xmlns="http://www.w3.org/2000/svg" width="640" height="528" viewBox="0 0 640 528" role="img">
<title>A contract becomes a test</title>
<desc>A requirement defines accepted input and output. A valid fixture exercises the intended path. Hostile variants test rejection. Runtime validation enforces the contract for real callers.</desc>
<rect width="100%" height="100%" fill="white"/>
<text x="320" y="30" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#173a53">A contract becomes a test</text>
<rect x="24" y="54" width="592" height="67" rx="7" fill="#f2f6f8" stroke="#426477" stroke-width="2"/>
<text x="320" y="79" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#173a53">Requirement</text>
<text x="320" y="103" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#253a45">Only a named, bounded read-only operation is allowed</text>
<path d="M320 124 V138 M314 133 L320 139 L326 133" fill="none" stroke="#426477" stroke-width="2"/>
<rect x="24" y="144" width="592" height="67" rx="7" fill="#f2f6f8" stroke="#426477" stroke-width="2"/>
<text x="320" y="169" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#173a53">Schema and types</text>
<text x="320" y="193" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#253a45">Define required fields, limits, result and error shapes</text>
<path d="M320 214 V228 M314 223 L320 229 L326 223" fill="none" stroke="#426477" stroke-width="2"/>
<rect x="24" y="234" width="592" height="67" rx="7" fill="#f2f6f8" stroke="#426477" stroke-width="2"/>
<text x="320" y="259" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#173a53">Accepted example</text>
<text x="320" y="283" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#253a45">Check the intended input and complete output</text>
<path d="M320 304 V318 M314 313 L320 319 L326 313" fill="none" stroke="#426477" stroke-width="2"/>
<rect x="24" y="324" width="592" height="67" rx="7" fill="#f2f6f8" stroke="#426477" stroke-width="2"/>
<text x="320" y="349" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#173a53">Rejected examples</text>
<text x="320" y="373" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#253a45">Unknown fields, oversized values and forbidden targets</text>
<path d="M320 394 V408 M314 403 L320 409 L326 403" fill="none" stroke="#426477" stroke-width="2"/>
<rect x="24" y="414" width="592" height="67" rx="7" fill="#f2f6f8" stroke="#426477" stroke-width="2"/>
<text x="320" y="439" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#173a53">Runtime enforcement</text>
<text x="320" y="463" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#253a45">Every caller is checked at the executable boundary</text>
</svg>
