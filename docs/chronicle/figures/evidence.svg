<svg xmlns="http://www.w3.org/2000/svg" width="640" height="528" viewBox="0 0 640 528" role="img">
<title>From retained evidence to a public account</title>
<desc>Sources are preserved and verified. Private analysis links claims to sources. An approved public projection produces the reader, PDF and evidence index.</desc>
<rect width="100%" height="100%" fill="white"/>
<text x="320" y="30" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#173a53">From retained evidence to a public account</text>
<rect x="24" y="54" width="592" height="67" rx="7" fill="#f2f6f8" stroke="#426477" stroke-width="2"/>
<text x="320" y="79" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#173a53">Primary records</text>
<text x="320" y="103" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#253a45">Source revisions, observations, reviews and tool events</text>
<path d="M320 124 V138 M314 133 L320 139 L326 133" fill="none" stroke="#426477" stroke-width="2"/>
<rect x="24" y="144" width="592" height="67" rx="7" fill="#f2f6f8" stroke="#426477" stroke-width="2"/>
<text x="320" y="169" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#173a53">Preserve and verify</text>
<text x="320" y="193" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#253a45">Retain permitted content; record exclusions and gaps</text>
<path d="M320 214 V228 M314 223 L320 229 L326 223" fill="none" stroke="#426477" stroke-width="2"/>
<rect x="24" y="234" width="592" height="67" rx="7" fill="#f2f6f8" stroke="#426477" stroke-width="2"/>
<text x="320" y="259" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#173a53">Private reconstruction</text>
<text x="320" y="283" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#253a45">Deduplicate, link decisions and reconcile counts</text>
<path d="M320 304 V318 M314 313 L320 319 L326 313" fill="none" stroke="#426477" stroke-width="2"/>
<rect x="24" y="324" width="592" height="67" rx="7" fill="#f2f6f8" stroke="#426477" stroke-width="2"/>
<text x="320" y="349" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#173a53">Public source review</text>
<text x="320" y="373" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#253a45">Clear claims, excerpts, rights and aggregate metrics</text>
<path d="M320 394 V408 M314 403 L320 409 L326 403" fill="none" stroke="#426477" stroke-width="2"/>
<rect x="24" y="414" width="592" height="67" rx="7" fill="#f2f6f8" stroke="#426477" stroke-width="2"/>
<text x="320" y="439" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#173a53">Versioned public edition</text>
<text x="320" y="463" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#253a45">Narrative, learning path, PDF and evidence index</text>
</svg>
