name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  ci_impact_shadow:
    name: CI impact plan (shadow)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      force_full: ${{ steps.plan.outputs.force_full }}
      plan_sha256: ${{ steps.plan.outputs.plan_sha256 }}
      selected_lanes: ${{ steps.plan.outputs.selected_lanes }}
    permissions:
      contents: read
    steps:
      - name: Check out impact-planning source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Produce fail-closed shadow impact plan
        id: plan
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) base_sha="$PR_BASE_SHA"; impact_event='pull_request' ;;
            push) base_sha="$PUSH_BASE_SHA"; impact_event='push_main' ;;
            *) echo 'Unsupported CI impact event' >&2; exit 1 ;;
          esac
          python3 scripts/plan_ci_impact.py \
            --base "$base_sha" \
            --head "$GITHUB_SHA" \
            --event "$impact_event" \
            --map .github/ci/verification-impact-map.v1.json \
            --output artifacts/ci/impact-plan.json
          plan_sha256="$(sha256sum artifacts/ci/impact-plan.json | cut -d ' ' -f 1)"
          force_full="$(jq -r '.force_full' artifacts/ci/impact-plan.json)"
          selected_lanes="$(jq -c '.selected_lanes' artifacts/ci/impact-plan.json)"
          printf 'plan_sha256=%s\n' "$plan_sha256" >> "$GITHUB_OUTPUT"
          printf 'force_full=%s\n' "$force_full" >> "$GITHUB_OUTPUT"
          printf 'selected_lanes=%s\n' "$selected_lanes" >> "$GITHUB_OUTPUT"
          {
            printf '### CI impact plan (shadow)\n\n'
            printf 'All current assurance jobs still run; this plan cannot skip a check.\n\n'
            printf -- '- Plan SHA-256: `%s`\n' "$plan_sha256"
            printf -- '- Force full: `%s`\n' "$force_full"
            printf -- '- Selected lanes:\n'
            jq -r '.selected_lanes[] | "  - `" + . + "`"' \
              artifacts/ci/impact-plan.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload shadow impact plan
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-impact-plan-${{ github.sha }}
          path: artifacts/ci/impact-plan.json
          if-no-files-found: error
          retention-days: 30

  repository_assurance:
    name: Repository assurance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Repository assurance verifies immutable QUAL runtime-base Git blobs.
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.2
          enable-cache: true

      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --locked --group dev --cache-dir .uv-cache

      - name: Run assurance
        run: pnpm run check

      - name: Enforce release readiness on a version transition
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) base_sha="$PR_BASE_SHA" ;;
            push) base_sha="$PUSH_BASE_SHA" ;;
            *) echo 'Unsupported release-transition event' >&2; exit 1 ;;
          esac
          if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ ]] || \
             [[ "$base_sha" == '0000000000000000000000000000000000000000' ]]; then
            echo 'A valid event base commit is required for release-transition assurance' >&2
            exit 1
          fi
          git cat-file -e "$base_sha^{commit}"
          git cat-file -e "$GITHUB_SHA^{commit}"
          set +e
          git diff --quiet "$base_sha" "$GITHUB_SHA" -- VERSION
          version_diff_status=$?
          set -e
          case "$version_diff_status" in
            0) ;;
            1) pnpm run validate:release-readiness ;;
            *) echo 'Unable to compare VERSION with the event base' >&2; exit 1 ;;
          esac

      - name: Package immutable Pages source
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && success() }}
        run: |
          uv run --locked --cache-dir .uv-cache python scripts/package_pages.py \
            --dist apps/public-explorer/dist \
            --output-dir artifacts/pages \
            --source-commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --version "$(tr -d '\n' < VERSION)" \
            --base-path /gis-ai-go/

      - name: Verify immutable Pages source
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && success() }}
        run: |
          uv run --locked --cache-dir .uv-cache python scripts/verify_pages_archive.py \
            --archive artifacts/pages/artifact.tar \
            --checksum artifacts/pages/artifact.tar.sha256 \
            --receipt artifacts/pages/archive-receipt.json \
            --expected-source-commit "$GITHUB_SHA" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-version "$(tr -d '\n' < VERSION)" \
            --expected-base-path /gis-ai-go/

      - name: Upload immutable Pages source
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-source-${{ github.sha }}
          path: artifacts/pages/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload generated evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assurance-evidence
          path: |
            artifacts/
            !artifacts/pages/**
            apps/public-explorer/test-results/
          if-no-files-found: warn

  gateway_image:
    name: Gateway image assurance
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    outputs:
      evidence_artifact_digest: ${{ steps.gateway_image_upload.outputs.artifact-digest }}
      evidence_artifact_id: ${{ steps.gateway_image_upload.outputs.artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Check out exact gateway source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.2
          enable-cache: true

      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --locked --group dev --cache-dir .uv-cache

      - name: Start the pinned gateway image builder
        run: |
          docker buildx create \
            --name gis-ai-go-gateway \
            --driver docker-container \
            --driver-opt image=moby/buildkit:buildx-stable-1@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8 \
            --use
          docker buildx inspect --bootstrap

      - name: Build and verify the blocked gateway image
        run: pnpm run check:gateway-image

      - name: Remove the isolated image builder
        if: always()
        run: docker buildx rm gis-ai-go-gateway

      - name: Upload immutable gateway image evidence
        id: gateway_image_upload
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gateway-image-${{ github.sha }}-without-grype-db
          path: |
            artifacts/gateway/
            !artifacts/gateway/gateway-node.grype-db.tar.zst
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  assurance:
    name: assurance
    if: always()
    needs:
      - ci_impact_shadow
      - repository_assurance
      - gateway_image
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all assurance producers to succeed
        env:
          CI_IMPACT_SHADOW_RESULT: ${{ needs.ci_impact_shadow.result }}
          GATEWAY_IMAGE_RESULT: ${{ needs.gateway_image.result }}
          REPOSITORY_ASSURANCE_RESULT: ${{ needs.repository_assurance.result }}
        run: |
          if [[ "$CI_IMPACT_SHADOW_RESULT" != 'success' ]] || \
             [[ "$REPOSITORY_ASSURANCE_RESULT" != 'success' ]] || \
             [[ "$GATEWAY_IMAGE_RESULT" != 'success' ]]; then
            printf 'CI impact plan (shadow): %s\n' "$CI_IMPACT_SHADOW_RESULT" >&2
            printf 'Repository assurance: %s\n' "$REPOSITORY_ASSURANCE_RESULT" >&2
            printf 'Gateway image assurance: %s\n' "$GATEWAY_IMAGE_RESULT" >&2
            exit 1
          fi

  provenance:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs:
      - assurance
      - repository_assurance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out attested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.2
          enable-cache: true

      - name: Download immutable Pages source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pages-source-${{ github.sha }}
          path: artifacts/pages

      - name: Verify archive before attestation
        run: |
          uv run --locked --cache-dir .uv-cache python scripts/verify_pages_archive.py \
            --archive artifacts/pages/artifact.tar \
            --checksum artifacts/pages/artifact.tar.sha256 \
            --receipt artifacts/pages/archive-receipt.json \
            --expected-source-commit "$GITHUB_SHA" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-version "$(tr -d '\n' < VERSION)" \
            --expected-base-path /gis-ai-go/

      - name: Attest immutable Pages source
        id: attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/pages/artifact.tar

      - name: Record provenance
        env:
          ATTESTATION_URL: ${{ steps.attestation.outputs.attestation-url }}
        run: |
          {
            printf '### Immutable Pages source\n\n'
            printf -- '- Source commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Artefact: `pages-source-%s`\n' "$GITHUB_SHA"
            printf -- '- Attestation: %s\n' "$ATTESTATION_URL"
          } >> "$GITHUB_STEP_SUMMARY"

  gateway_independent_image:
    name: Independent gateway image derivation
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      independent_artifact_digest: ${{ steps.gateway_independent_upload.outputs.artifact-digest }}
      independent_artifact_id: ${{ steps.gateway_independent_upload.outputs.artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Check out exact independent gateway source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.2
          enable-cache: true

      - name: Install locked independent-builder dependencies
        run: uv sync --locked --group dev --cache-dir .uv-cache

      - name: Regenerate the governed OKF projection independently
        run: |
          uv run --locked --cache-dir .uv-cache python scripts/build_okf.py \
            --output artifacts/okf

      - name: Start the independent pinned gateway image builder
        run: |
          docker buildx create \
            --name gis-ai-go-gateway \
            --driver docker-container \
            --driver-opt image=moby/buildkit:buildx-stable-1@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8 \
            --use
          docker buildx inspect --bootstrap

      - name: Build an independent clean gateway OCI derivation
        run: |
          uv run --locked --cache-dir .uv-cache python scripts/package_gateway_oci.py \
            --output-dir artifacts/gateway-independent \
            --platform linux/amd64

      - name: Verify the independent clean gateway OCI derivation
        run: |
          uv run --locked --cache-dir .uv-cache python scripts/verify_gateway_oci.py \
            --archive artifacts/gateway-independent/gateway-image.oci.tar \
            --checksum artifacts/gateway-independent/gateway-image.oci.tar.sha256 \
            --receipt artifacts/gateway-independent/image-receipt.json \
            --context-manifest artifacts/gateway-independent/build-context.sha256 \
            --expected-source-commit "$GITHUB_SHA" \
            --require-clean

      - name: Remove the independent image builder
        if: always()
        run: docker buildx rm gis-ai-go-gateway

      - name: Upload immutable independent gateway derivation
        id: gateway_independent_upload
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gateway-image-independent-${{ github.sha }}
          path: |
            artifacts/gateway-independent/build-context.sha256
            artifacts/gateway-independent/gateway-image.oci.tar
            artifacts/gateway-independent/gateway-image.oci.tar.sha256
            artifacts/gateway-independent/image-receipt.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  gateway_attestation_verification:
    name: Gateway attestation verification
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs:
      - assurance
      - gateway_image
      - gateway_independent_image
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out exact gateway verification source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.2
          enable-cache: true

      - name: Install locked verifier dependencies
        run: uv sync --locked --group dev --cache-dir .uv-cache

      - name: Download exact producer gateway evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.gateway_image.outputs.evidence_artifact_id }}
          path: artifacts/gateway
          digest-mismatch: error

      - name: Download exact independent gateway derivation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.gateway_independent_image.outputs.independent_artifact_id }}
          path: artifacts/gateway-independent
          digest-mismatch: error

      - name: Regenerate the governed OKF projection
        run: |
          uv run --locked --cache-dir .uv-cache python scripts/build_okf.py \
            --output artifacts/okf

      - name: Acquire and validate pinned Trivy scanner over network
        env:
          TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          TRIVY_REPO_DIGEST: aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
        run: |
          docker pull "$TRIVY_IMAGE"
          docker image inspect "$TRIVY_IMAGE" |
            jq -e --arg expected "$TRIVY_REPO_DIGEST" '
              length == 1 and
              (.[0].RepoDigests | type == "array" and index($expected) != null)
            ' > /dev/null

      - name: Acquire and validate pinned Grype scanner over network
        env:
          GRYPE_IMAGE: anchore/grype:v0.117.0@sha256:ab8d929faec38875a45aba74c9651549cd096756d1981773c04375f282e91075
          GRYPE_REPO_DIGEST: anchore/grype@sha256:ab8d929faec38875a45aba74c9651549cd096756d1981773c04375f282e91075
        run: |
          docker pull --platform linux/amd64 "$GRYPE_IMAGE"
          docker image inspect "$GRYPE_IMAGE" |
            jq -e --arg expected "$GRYPE_REPO_DIGEST" '
              length == 1 and
              (.[0].RepoDigests | type == "array" and index($expected) != null)
            ' > /dev/null

      - name: Rehydrate checksum-bound private Grype database
        run: |
          uv run --locked --cache-dir .uv-cache python scripts/node_runtime_advisory.py \
            restore-database \
            --scan artifacts/gateway/gateway-image.vulnerability-scan.json \
            --output-dir artifacts/gateway

      - name: Verify complete protected-main gateway image evidence
        run: |
          uv run --locked --cache-dir .uv-cache python \
            scripts/verify_gateway_image_evidence.py \
            --directory artifacts/gateway \
            --expected-source-commit "$GITHUB_SHA" \
            --require-clean \
            --require-current-node-advisory

      - name: Verify downloaded independent gateway derivation
        run: |
          uv run --locked --cache-dir .uv-cache python scripts/verify_gateway_oci.py \
            --archive artifacts/gateway-independent/gateway-image.oci.tar \
            --checksum artifacts/gateway-independent/gateway-image.oci.tar.sha256 \
            --receipt artifacts/gateway-independent/image-receipt.json \
            --context-manifest artifacts/gateway-independent/build-context.sha256 \
            --expected-source-commit "$GITHUB_SHA" \
            --require-clean

      - name: Compare producer and independent gateway bytes
        run: |
          python3 scripts/verify_gateway_provenance.py compare-rebuild \
            --accepted-archive artifacts/gateway/gateway-image.oci.tar \
            --accepted-checksum artifacts/gateway/gateway-image.oci.tar.sha256 \
            --independent-archive artifacts/gateway-independent/gateway-image.oci.tar \
            --independent-checksum artifacts/gateway-independent/gateway-image.oci.tar.sha256

  gateway-provenance:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs:
      - assurance
      - gateway_image
      - gateway_independent_image
      - gateway_attestation_verification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out attested gateway source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download exact original gateway evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.gateway_image.outputs.evidence_artifact_id }}
          path: artifacts/gateway
          digest-mismatch: error

      - name: Download exact independent gateway derivation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.gateway_independent_image.outputs.independent_artifact_id }}
          path: artifacts/gateway-independent
          digest-mismatch: error

      - name: Verify independent bytes and current evidence before OIDC attestation
        run: |
          python3 scripts/verify_gateway_provenance.py compare-rebuild \
            --accepted-archive artifacts/gateway/gateway-image.oci.tar \
            --accepted-checksum artifacts/gateway/gateway-image.oci.tar.sha256 \
            --independent-archive artifacts/gateway-independent/gateway-image.oci.tar \
            --independent-checksum artifacts/gateway-independent/gateway-image.oci.tar.sha256
          python3 scripts/verify_gateway_provenance.py verify-attestation-inputs \
            --directory artifacts/gateway \
            --expected-source-commit "$GITHUB_SHA"

      - name: Attest immutable gateway OCI archive
        id: gateway-attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/gateway/gateway-image.oci.tar

      - name: Attest gateway image SBOM
        id: gateway-sbom-attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/gateway/gateway-image.sbom.cdx.json

      - name: Attest gateway image evidence manifest
        id: gateway-evidence-attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/gateway/gateway-image-evidence-manifest.json

      - name: Record gateway image provenance
        env:
          GATEWAY_ATTESTATION_URL: ${{ steps.gateway-attestation.outputs.attestation-url }}
          GATEWAY_EVIDENCE_ATTESTATION_URL: ${{ steps.gateway-evidence-attestation.outputs.attestation-url }}
          GATEWAY_SBOM_ATTESTATION_URL: ${{ steps.gateway-sbom-attestation.outputs.attestation-url }}
          PRODUCER_ARTIFACT_DIGEST: ${{ needs.gateway_image.outputs.evidence_artifact_digest }}
          PRODUCER_ARTIFACT_ID: ${{ needs.gateway_image.outputs.evidence_artifact_id }}
        run: |
          {
            printf '### Blocked gateway image\n\n'
            printf -- '- Source commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Producer artefact ID: `%s`\n' "$PRODUCER_ARTIFACT_ID"
            printf -- '- Producer transport digest: `%s`\n' "$PRODUCER_ARTIFACT_DIGEST"
            printf -- '- OCI attestation: %s\n' "$GATEWAY_ATTESTATION_URL"
            printf -- '- SBOM attestation: %s\n' "$GATEWAY_SBOM_ATTESTATION_URL"
            printf -- '- Evidence manifest attestation: %s\n' "$GATEWAY_EVIDENCE_ATTESTATION_URL"
          } >> "$GITHUB_STEP_SUMMARY"
